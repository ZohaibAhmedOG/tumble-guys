<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tumble Guys - Party Platformer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    /* Loading screen */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Menu */
    #main-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      z-index: 100;
    }

    #main-menu.hidden {
      display: none;
    }

    #main-menu h1 {
      font-size: 72px;
      margin-bottom: 40px;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
      background: linear-gradient(45deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .menu-button {
      display: block;
      width: 300px;
      margin: 15px auto;
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .menu-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .menu-button:active {
      transform: translateY(-1px);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #hud.hidden {
      display: none;
    }

    .hud-item {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    /* Pause Menu */
    #pause-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: white;
      z-index: 200;
    }

    #pause-menu.hidden {
      display: none;
    }

    #pause-menu h2 {
      font-size: 48px;
      margin-bottom: 30px;
    }

    /* Controls Info */
    #controls-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    #controls-info.hidden {
      display: none;
    }

    #controls-info div {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-overlay">
      <!-- Loading Screen -->
      <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div>Loading Tumble Guys...</div>
      </div>

      <!-- Main Menu -->
      <div id="main-menu" class="hidden">
        <h1>🎮 TUMBLE GUYS</h1>
        <button class="menu-button" id="btn-play">Play</button>
        <button class="menu-button" id="btn-levels">Level Select</button>
        <button class="menu-button" id="btn-customize">Customize</button>
        <button class="menu-button" id="btn-settings">Settings</button>
      </div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-item">⏱️ <span id="timer">0:00</span></div>
        <div class="hud-item">📍 Position: <span id="position">1st</span></div>
        <div class="hud-item">✓ Checkpoint: <span id="checkpoint">0</span></div>
      </div>

      <!-- Pause Menu -->
      <div id="pause-menu" class="hidden">
        <h2>⏸️ PAUSED</h2>
        <button class="menu-button" id="btn-resume">Resume</button>
        <button class="menu-button" id="btn-restart">Restart</button>
        <button class="menu-button" id="btn-quit">Quit to Menu</button>
      </div>

      <!-- Controls Info -->
      <div id="controls-info" class="hidden">
        <div><strong>Controls:</strong></div>
        <div>WASD / Arrow Keys - Move</div>
        <div>Space - Jump</div>
        <div>ESC - Pause</div>
      </div>

      <!-- Win Screen -->
      <div id="win-screen" class="hidden" style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: white;
        z-index: 300;
        display: none;
      ">
        <h2 style="font-size: 64px; margin-bottom: 20px;">🎉 YOU WIN! 🎉</h2>
        <div id="win-time" style="font-size: 32px; margin-bottom: 10px;">Time: 0:00</div>
        <div id="win-position" style="font-size: 24px; margin-bottom: 30px;">Position: 1st</div>
        <button class="menu-button" id="btn-next-level">Next Level</button>
        <button class="menu-button" id="btn-replay">Replay Level</button>
        <button class="menu-button" id="btn-main-menu">Main Menu</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
